# =========================================================
# Deploy to GitHub Pages
# 构建静态站点并发布到 GitHub Pages
# 触发方式：
#   1. push 到 main 分支
#   2. 手动触发（Actions 页面点击 Run workflow）
# =========================================================
name: Deploy to GitHub Pages

on:
  # push 到 main 分支时自动部署
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发部署
  workflow_dispatch:

# 工作流权限（最小化授权原则，只授予必要权限）
permissions:
  contents: read          # 只读代码仓库内容（build 需要检出代码）
  pages: write            # 向 GitHub Pages 写入部署内容
  id-token: write         # 获取 OIDC 令牌（deploy-pages 认证需要）

# 并发控制：同一时间只允许一个部署任务运行
concurrency:
  group: pages            # 按组名串行化
  cancel-in-progress: false  # 新的触发不取消正在运行的部署

jobs:
  # ============ 构建任务 ============
  build:
    runs-on: ubuntu-latest   # 使用最新的 Ubuntu 运行器
    env:
      # 强制所有 JavaScript action 显式运行在 Node 24 上，
      # 消除旧版 action（Node 20）的弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout        # 检出仓库代码
        uses: actions/checkout@v5

      - name: Setup Node      # 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 22    # 使用 Node 22 LTS

      - name: Install dependencies  # 安装项目依赖
        run: npm ci           # 依据 package-lock.json 精确安装，保证构建可复现

      - name: Build           # 构建静态站点
        run: npm run build    # Vite 构建，产物输出到 dist/ 目录

      - name: Upload artifact # 上传构建产物，供 deploy 任务部署
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist          # 指定上传 dist 目录

  # ============ 部署任务 ============
  deploy:
    needs: build          # 等待 build 任务成功后才执行
    runs-on: ubuntu-latest
    environment:
      name: github-pages      # 部署到 github-pages 环境
      url: ${{ steps.deployment.outputs.page_url }}  # 部署完成后展示站点 URL
    steps:
      - name: Deploy to GitHub Pages  # 从 artifact 发布站点
        id: deployment
        uses: actions/deploy-pages@v5

  # ============ 飞书通知任务 ============
  # 监听 build + deploy 结果，向飞书机器人推送一条文本消息。
  # 依赖说明：
  #   needs: [build, deploy]  -> 等 build 与 deploy 两个任务都结束（无论结果）后再执行本任务
  # 触发条件说明：
  #   if: always()            -> 无论 build / deploy 成功还是失败，本任务都会执行，发送通知
  #   ⚠️ 如果你只想在「部署失败时」才通知，请把上面的 if: always() 改成 if: failure()
  #      （failure() 表示任一前置任务失败时执行；若只想成功时通知则用 if: success()）
  # 前置要求：
  #   需在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置仓库密钥
  #   FEISHU_WEBHOOK（值为飞书机器人 webhook 地址）。未配置时本任务会失败，
  #   但不会影响 build / deploy 任务，站点仍会正常部署。
  notify:
    needs: [build, deploy]
    if: always()   # 成功/失败都通知；仅失败时通知请改为 if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout        # notify 是独立 job，需要先检出代码才能读取 src/data/site.js
        uses: actions/checkout@v5

      - name: Read site URL   # 从 src/data/site.js 读取 site.devnote 作为线上访问地址
        id: site
        run: |
          # 正则提取 site.js 中 site.devnote 的值（如 https://devnote.site），写入 step 输出供后续步骤使用
          URL=$(node -e "const fs=require('fs');const s=fs.readFileSync('src/data/site.js','utf8');const m=s.match(/devnote:\s*['\"]([^'\"]+)['\"]/);process.stdout.write(m?m[1]:'')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Send Feishu notification   # 组装并发送飞书文本消息
        env:
          # 飞书机器人 webhook 地址，取自仓库密钥（不硬编码在文件中）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 综合 build 与 deploy 结果得出最终状态（两者都成功才视为成功）
          STATUS: ${{ (needs.build.result == 'success' && needs.deploy.result == 'success') && '成功' || '失败' }}
          BUILD_RESULT: ${{ needs.build.result }}    # build 任务结果（success/failure/cancelled）
          DEPLOY_RESULT: ${{ needs.deploy.result }}  # deploy 任务结果（success/failure/cancelled）
          REPO: ${{ github.server_url }}/${{ github.repository }}  # 仓库全链接（如 https://github.com/owner/repo）
          BRANCH: ${{ github.ref_name }}             # 触发部署的分支名
          COMMIT_MSG: ${{ github.event.head_commit.message || '手动触发 / Workflow dispatch' }}  # 提交信息（手动触发时回退）
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}  # Actions 运行详情链接
          SITE_URL: ${{ steps.site.outputs.url }}   # 线上访问地址，取自 site.js 的 site.devnote
        run: |
          # 用 jq 构造飞书 msg_type:text 消息体，再通过 curl POST 到飞书 webhook
          jq -n \
            --arg status "$STATUS" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_MSG" \
            --arg build "$BUILD_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg url "$RUN_URL" \
            --arg site_url "$SITE_URL" \
            '{
              msg_type: "text",
              content: {
                text: "GitHub Pages 部署\($status)\n仓库：\($repo)\n分支：\($branch)\n提交：\($commit)\n构建：\($build) | 部署：\($deploy)\n查看详情：\($url)\n访问地址：\($site_url)"
              }
            }' | curl -s -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" -d @-
